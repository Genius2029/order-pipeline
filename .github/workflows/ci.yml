name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orders_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
          --health-start-period 20s

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/orders_test
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/orders_test
      RABBITMQ_URL: amqp://ci:ci@localhost:5672/
      SECRET_KEY: ci-test-secret-key
      BOT_TOKEN: "123456789:CI_TEST_TOKEN_aaaaaaaaaaaaaaaaaaaaaaaaaa"
      BOT_USERNAME: ci_test_bot

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Migrations apply on an empty database and match the models
        run: |
          alembic upgrade head
          alembic check

      - name: Unit and API tests
        run: pytest -v

      - name: Integration tests (real RabbitMQ)
        run: pytest -v -m integration

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t order-pipeline .